apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: project0
  labels:
    app.kubernetes.io/name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - configMapRef:
                name: project0-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_PASSWORD
            # Una subcarpeta y no la raíz del disco, porque Postgres exige empezar
            # con la carpeta vacía y en muchos discos la raíz trae lost+found.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: datos
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
          livenessProbe:
            tcpSocket:
              port: postgres
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: datos
      spec:
        storageClassName: standard-retain
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
