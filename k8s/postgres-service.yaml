# Sin ClusterIP, para que cada pod del StatefulSet tenga su propio nombre en el
# DNS, como postgres-0.postgres.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: project0
  labels:
    app.kubernetes.io/name: postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
