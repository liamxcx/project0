apiVersion: batch/v1
kind: CronJob
metadata:
  name: collector
  namespace: project0
  labels:
    app.kubernetes.io/name: collector
spec:
  schedule: "0 * * * *"
  timeZone: Europe/Madrid
  startingDeadlineSeconds: 1800
  # Dos collectors a la vez pedirían a Riot las mismas partidas.
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: collector
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-pull
          containers:
            - name: collector
              image: ghcr.io/liamxcx/project0:193e9e2
              command: ["python", "collector.py"]
              envFrom:
                - configMapRef:
                    name: project0-config
                - configMapRef:
                    name: collector-config
              env:
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: db-credentials
                      key: POSTGRES_PASSWORD
                - name: RIOT_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: riot-credentials
                      key: RIOT_API_KEY
              # Con --refetch de 20 partidas el pico fue de 42 MiB y la media
              # de CPU de unos 90m. Sin límite de CPU, como la API.
              resources:
                requests:
                  cpu: 100m
                  memory: 64Mi
                limits:
                  memory: 128Mi
