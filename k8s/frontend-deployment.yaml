apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: project0
  labels:
    app.kubernetes.io/name: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: frontend
          image: ghcr.io/liamxcx/project0-frontend:193e9e2
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            tcpSocket:
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          # nginx arranca un worker por cada CPU del nodo, no del contenedor, así
          # que la memoria depende del nodo. En kind, unos 17 MiB sin tráfico.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
