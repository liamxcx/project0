apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: project0
  labels:
    app.kubernetes.io/name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      # La imagen es privada en GHCR. El Secret se crea a mano porque lleva el
      # token, así que no está en el repo.
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: api
          image: ghcr.io/liamxcx/project0:c2dece7
          # La misma imagen sirve para api, collector y scheduler, así que cada
          # manifiesto elige qué proceso arranca.
          command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          # Si /health deja de responder, el kubelet reinicia el contenedor. Por eso
          # no mira Postgres, porque reiniciar la API no arregla la base.
          livenessProbe:
            httpGet:
              path: /health
              port: http
          # Si /ready falla, el pod deja de recibir tráfico del Service, pero no se
          # reinicia. Vuelve a recibirlo cuando Postgres responde otra vez.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            # Por defecto es 1 s, menos que los 2 s que /ready espera a Postgres
            # antes de contestar con un 503
            timeoutSeconds: 3
          envFrom:
            - configMapRef:
                name: project0-config
            - configMapRef:
                name: api-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_PASSWORD
          # En Compose la API usa unos 53 MiB. Sin límite de CPU, porque un
          # límite frena el proceso en los picos aunque el nodo esté libre.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
