apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: project0
  labels:
    app.kubernetes.io/name: redis
spec:
  # Una sola réplica, porque cada una tendría su propia caché. Si Redis cae, la
  # API sigue respondiendo desde Postgres.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      containers:
        - name: redis
          image: redis:8-alpine
          # Solo es caché, así que no guarda nada en disco. Al llegar al límite de
          # memoria borra las claves menos usadas en vez de rechazar escrituras.
          args:
            - --save
            - ""
            - --appendonly
            - "no"
            - --maxmemory
            - 100mb
            - --maxmemory-policy
            - allkeys-lru
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
          livenessProbe:
            tcpSocket:
              port: redis
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
