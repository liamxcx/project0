# Las reglas de entrada de project0. Cuelgan del Gateway public, que comparte
# todo el clúster, y reparten las peticiones entre la página y la API.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: project0
  namespace: project0
  labels:
    app.kubernetes.io/name: project0
spec:
  parentRefs:
    - name: public
      namespace: traefik
      sectionName: web
  rules:
    # Solo se publica lo que usa la página. /health, /ready y /docs se quedan
    # dentro del clúster.
    - matches:
        - path:
            type: Exact
            value: /api/matches
      filters:
        # La API tiene la ruta sin el prefijo, así que se cambia al reenviar.
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /matches
      backendRefs:
        - name: api
          port: 80
    # Todo lo demás es la página.
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 80
