# Las reglas que comparten Compose y el clúster. Las trae el server de cada uno
# con include, así que aquí solo van directivas de dentro de un server.
root /usr/share/nginx/html;

# Sin esto el navegador adivina la codificación del CSS, y puede leer
# los caracteres que no son ASCII como si fueran de otra
charset utf-8;
charset_types text/css application/javascript;

# De dónde puede cargar cosas la página. Va por partes en una variable para que
# se pueda leer, y se pone en las dos location que devuelven index.html
set $csp "default-src 'none'; ";
set $csp "${csp}script-src 'self'; style-src 'self'; font-src 'self'; ";
set $csp "${csp}img-src 'self' https://ddragon.leagueoflegends.com; ";
set $csp "${csp}connect-src 'self' https://ddragon.leagueoflegends.com; ";
set $csp "${csp}base-uri 'none'; form-action 'none'; frame-ancestors 'none'";

# La página cambia con cada versión, así que el navegador guarda los ficheros
# pero pregunta antes de usarlos. Si no han cambiado, nginx responde 304.
location / {
    index index.html;
    add_header Cache-Control "no-cache";
    # Dentro de cada location, porque una que tiene su propio add_header
    # ignora los de fuera
    add_header Content-Security-Policy $csp;
}

# Las rutas de perfil no son ficheros. Las resuelve el JavaScript de la
# página, así que nginx devuelve siempre index.html
location /invocador/ {
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy $csp;
}

# La fuente y los emblemas casi nunca cambian, así que valen un día sin preguntar
location /fonts/ {
    add_header Cache-Control "max-age=86400";
}

location /emblems/ {
    add_header Cache-Control "max-age=86400";
}
