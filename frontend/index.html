<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Estadísticas de LoL</title>
  </head>
  <body>
    <h1>Estadísticas de LoL</h1>
    <pre id="salida">Cargando...</pre>

    <script>
      const salida = document.getElementById("salida");

      fetch("http://localhost:8000/champions")
        .then((r) => r.json())
        .then((datos) => {
          salida.textContent = JSON.stringify(datos, null, 2);
        })
        .catch((error) => {
          salida.textContent = "Error: " + error;
        });
    </script>
  </body>
</html>
