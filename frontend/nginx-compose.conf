# Solo para Compose. Hace de puerta única, como Traefik en el clúster, para
# que la página y la API compartan origen.
server {
    listen 80;

    # La API tiene la ruta sin el prefijo, igual que con la HTTPRoute.
    location = /api/matches {
        proxy_pass http://api:8000/matches;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}
