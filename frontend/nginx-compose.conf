# Solo para Compose. Hace de puerta única, como Traefik en el clúster, para
# que la página y la API compartan origen.
server {
    listen 80;
    root /usr/share/nginx/html;

    # La API tiene las rutas sin el prefijo. La barra final de proxy_pass
    # quita el /api/ al reenviar, así que /api/rank llega como /rank.
    location /api/ {
        proxy_pass http://api:8000/;
    }

    # Las rutas internas de la API no se publican. La expresión regular gana
    # al prefijo de arriba, así que estas no llegan a la API.
    location ~ ^/api/(health|ready|docs|redoc|openapi\.json)(/|$) {
        return 404;
    }

    # La página cambia con cada versión, así que el navegador guarda los ficheros
    # pero pregunta antes de usarlos. Si no han cambiado, nginx responde 304.
    location / {
        index index.html;
        add_header Cache-Control "no-cache";
    }

    # Las rutas de perfil no son ficheros. Las resuelve el JavaScript de la
    # página, así que nginx devuelve siempre index.html
    location /invocador/ {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    # La fuente y los emblemas casi nunca cambian, así que valen un día sin preguntar
    location /fonts/ {
        add_header Cache-Control "max-age=86400";
    }

    location /emblems/ {
        add_header Cache-Control "max-age=86400";
    }
}
