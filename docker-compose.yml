x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - datos_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *default-logging

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging: *default-logging

  flyway:
    image: flyway/flyway:13-alpine
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      FLYWAY_LOCATIONS: filesystem:/flyway/migrations
    volumes:
      - ./migrations:/flyway/migrations:ro
    depends_on:
      db:
        condition: service_healthy
    logging: *default-logging

  collector:
    build: .
    env_file: .env
    depends_on:
      flyway:
        condition: service_completed_successfully
    logging: *default-logging

  api:
    build: .
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      flyway:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    logging: *default-logging

  frontend:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      # Solo public/, para no servir también el Dockerfile y la configuración
      - ./frontend/public:/usr/share/nginx/html:ro
      - ./frontend/nginx-compose.conf:/etc/nginx/conf.d/default.conf:ro
      # Fuera de conf.d, porque nginx carga solo todo lo que hay ahí y este
      # fichero solo vale dentro de un server
      - ./frontend/nginx-common.conf:/etc/nginx/snippets/common.conf:ro
    # nginx busca la IP de api al arrancar y se queda con ella. Si Compose
    # recrea la API, cambia de IP, así que nginx se reinicia con ella
    depends_on:
      api:
        condition: service_started
        restart: true
    logging: *default-logging

volumes:
  datos_db:
