{{- if .Values.api.serviceMonitor.enabled }}
# Le dice a Prometheus que lea /metrics en cada pod de la API. Prometheus usa el
# Service solo para encontrar los pods, y luego pregunta a cada uno por su IP.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: api
    {{- include "project0.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  endpoints:
    - port: http
      path: /metrics
{{- end }}
