apiVersion: batch/v1
kind: CronJob
metadata:
  name: collector
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: collector
    {{- include "project0.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.collector.schedule | quote }}
  timeZone: {{ .Values.timezone }}
  startingDeadlineSeconds: 1800
  # Dos collectors a la vez pedirían a Riot las mismas partidas.
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: collector
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-pull
          containers:
            - name: collector
              image: ghcr.io/liamxcx/project0:{{ include "project0.imageTag" . }}
              command: ["python", "collector.py"]
              envFrom:
                - configMapRef:
                    name: project0-config
                - configMapRef:
                    name: collector-config
              env:
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: db-credentials
                      key: POSTGRES_PASSWORD
                - name: RIOT_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: riot-credentials
                      key: RIOT_API_KEY
              resources:
                {{- toYaml .Values.collector.resources | nindent 16 }}
