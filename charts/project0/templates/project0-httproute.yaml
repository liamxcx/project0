# Las reglas de entrada de project0. Cuelgan del Gateway de values, que comparte
# todo el clúster, y reparten las peticiones entre la página y la API.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: project0
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: project0
    {{- include "project0.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: {{ .Values.gateway.sectionName }}
  rules:
    # Las rutas internas de la API no se publican. Gateway API no tiene una
    # acción de responder 404, así que van al frontend, que no las tiene
    - matches:
        - path: { type: PathPrefix, value: /api/health }
        - path: { type: PathPrefix, value: /api/ready }
        - path: { type: PathPrefix, value: /api/docs }
        - path: { type: PathPrefix, value: /api/redoc }
        - path: { type: PathPrefix, value: /api/openapi.json }
        - path: { type: PathPrefix, value: /api/metrics }
      backendRefs:
        - name: frontend
          port: 80
    # El resto de /api/ va a la API sin el prefijo, así que /api/rank llega como
    # /rank. Gana el prefijo más largo, así que las de arriba no llegan aquí
    - matches:
        - path:
            type: PathPrefix
            value: /api
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: api
          port: 80
    # Todo lo demás es la página.
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 80
