# Lo justo para lanzar el collector a mano. Leer el CronJob para copiar su
# plantilla, y crear y listar Jobs para saber si ya hay uno en marcha.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: collector-trigger
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: api
    {{- include "project0.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    resourceNames: ["collector"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "list"]
