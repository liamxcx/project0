{{- if .Values.refresh.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-collector-trigger
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: api
    {{- include "project0.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: collector-trigger
subjects:
  - kind: ServiceAccount
    name: api
    namespace: {{ .Release.Namespace }}
{{- end }}
