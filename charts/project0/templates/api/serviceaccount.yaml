{{- if .Values.refresh.enabled }}
# Identidad propia para la API, porque necesita permisos que el resto de pods no
# tiene. Con la default del namespace no podría lanzar el collector.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: api
    {{- include "project0.labels" . | nindent 4 }}
{{- end }}
