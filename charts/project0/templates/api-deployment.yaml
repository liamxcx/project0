apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: api
    {{- include "project0.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      # La API lee las variables al arrancar. El checksum es solo de los data de cada
      # ConfigMap, así que el pod se recrea si cambian ellos y no si cambia un label.
      annotations:
        checksum/project0-config: {{ (include (print $.Template.BasePath "/project0-configmap.yaml") . | fromYaml).data | toYaml | sha256sum }}
        checksum/api-config: {{ (include (print $.Template.BasePath "/api-configmap.yaml") . | fromYaml).data | toYaml | sha256sum }}
      labels:
        app.kubernetes.io/name: api
    spec:
      # La imagen es privada en GHCR. El Secret se crea a mano porque lleva el
      # token, así que no está en el repo.
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: api
          image: ghcr.io/liamxcx/project0:{{ include "project0.imageTag" . }}
          # La misma imagen sirve para la API y el collector, así que cada
          # manifiesto elige qué proceso arranca.
          command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            # Por defecto es 1 s, menos que los 2 s que /ready espera a Postgres
            # antes de contestar con un 503
            timeoutSeconds: 3
          envFrom:
            - configMapRef:
                name: project0-config
            - configMapRef:
                name: api-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_PASSWORD
            # El mismo tag que la imagen, para las claves de Redis
            - name: APP_VERSION
              value: {{ include "project0.imageTag" . | quote }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
