# Da a los pods de la API un nombre y una IP fijos dentro del clúster. Es
# ClusterIP porque desde fuera se entra por Traefik y no por aquí.
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: api
    {{- include "project0.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 80
      targetPort: http
