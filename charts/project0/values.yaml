# Tag de las tres imágenes propias (API y collector, migraciones y frontend).
# Vacío usa el appVersion de Chart.yaml; se cambia aquí o con --set para probar otro.
image:
  tag: ""

timezone: Europe/Madrid

# El Gateway de la entrada al clúster. No es de este chart, se instala aparte
# con Traefik, así que depende de cada clúster.
gateway:
  name: public
  namespace: traefik
  sectionName: web

# Los nombres por los que se entra a la página. Sin ninguno, la ruta acepta
# cualquier nombre y se quedaría con el /api de las demás aplicaciones del Gateway.
hostnames:
  - localhost

postgres:
  image: postgres:16
  user: loltest
  database: lolstats
  # Solo cuentan al crear el StatefulSet. Kubernetes no deja cambiarlos después,
  # así que en una instalación que ya existe hacen fallar el upgrade.
  storage:
    className: standard-retain
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

redis:
  image: redis:8-alpine
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      memory: 128Mi

api:
  replicas: 2
  cacheTtlSeconds: 60
  # En Compose la API usa unos 53 MiB. Sin límite de CPU, porque un
  # límite frena el proceso en los picos aunque el nodo esté libre.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

# El botón de actualizar de la web. Con false no se crean los permisos de la API
# para lanzar el collector, y la web no enseña el botón.
refresh:
  enabled: true

# El ServiceMonitor de la API y las alertas son tipos del Prometheus Operator. En
# un clúster sin él la instalación fallaría, así que ahí hay que apagarlo.
monitoring:
  enabled: true

migrations:
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi

frontend:
  replicas: 2
  # nginx arranca dos workers (nginx.conf), así que la memoria no depende del
  # nodo. En kind, unos 12 MiB sin tráfico.
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

collector:
  # Cada hora en punto, en la zona de timezone
  schedule: "0 * * * *"
  matchCount: 20
  # Con --refetch de 20 partidas el pico fue de 42 MiB y la media
  # de CPU de unos 90m. Sin límite de CPU, como la API.
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      memory: 128Mi
