# En kind estos cuatro solo escuchan en 127.0.0.1 dentro del nodo y Prometheus no
# llega a ellos. Apagarlos quita también sus alertas, que saltarían siempre.
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false

defaultRules:
  disabled:
    # Los nodos de kind usan el reloj de la máquina virtual de Docker, sin NTP, y nunca
    # salen sincronizados aunque vayan en hora. NodeClockSkewDetected sigue vigilando.
    NodeClockNotSynchronising: true

grafana:
  admin:
    # Creado a mano, como el resto de Secrets. Si lo genera el chart, cambia en
    # cada helm template y el kubectl diff lo daría siempre por modificado.
    existingSecret: grafana-admin
  # Se entra por Traefik en http://grafana.localhost. Un nombre .localhost apunta
  # siempre a la propia máquina, y kind solo publica el 80 en 127.0.0.1.
  route:
    main:
      enabled: true
      hostnames: [grafana.localhost]
      parentRefs:
        - name: public
          namespace: traefik
          sectionName: web

prometheus:
  # Como Grafana, en http://prometheus.localhost. No tiene login, así que no se
  # puede publicar así en un clúster al que se llegue desde fuera.
  route:
    main:
      enabled: true
      hostnames: [prometheus.localhost]
      parentRefs:
        - name: public
          namespace: traefik
          sectionName: web
  prometheusSpec:
    # Lee los ServiceMonitor y PrometheusRule de todo el clúster, no solo los de este
    # chart, así que las aplicaciones no tienen que saber el nombre de esta release.
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    # Por debajo del disco, para que Prometheus borre lo viejo antes de llenarlo.
    retentionSize: 4GB
    # Con disco propio el historial sobrevive a los reinicios. Usa standard y no
    # standard-retain porque perder métricas no es grave, al revés que las partidas.
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: standard
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

alertmanager:
  # Los avisos van a un canal de Discord. La URL del webhook es secreta, así que va
  # en el Secret alertmanager-discord, creado a mano, y se lee del fichero montado.
  config:
    route:
      receiver: discord
      # Watchdog está siempre disparada a propósito, e InfoInhibitor solo sirve para
      # callar las de gravedad info. Las dos siguen sin avisar, como en el chart.
      routes:
        - receiver: "null"
          matchers:
            - alertname =~ "Watchdog|InfoInhibitor"
    receivers:
      - name: "null"
      - name: discord
        discord_configs:
          - webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord/webhook-url
  alertmanagerSpec:
    secrets:
      - alertmanager-discord
  # Como Grafana, en http://alertmanager.localhost. Tampoco tiene login.
  route:
    main:
      enabled: true
      hostnames: [alertmanager.localhost]
      parentRefs:
        - name: public
          namespace: traefik
          sectionName: web
