# La entrada HTTP del clúster. Vive junto a Traefik y la comparten las
# aplicaciones, que cuelgan de ella sus HTTPRoute.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: traefik
spec:
  gatewayClassName: traefik
  listeners:
    - name: web
      protocol: HTTP
      # Tiene que coincidir con el entryPoint web de Traefik, que escucha en el
      # 8000. El 80 de fuera llega a él por el hostPort.
      port: 8000
      # Solo se aceptan rutas de estos namespaces. Una aplicación nueva que
      # quiera entrar por aquí se añade a la lista.
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [project0, monitoring]
