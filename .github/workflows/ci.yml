name: CI

on: push

# Las Actions van fijadas por el SHA de su commit y no por un tag, porque un
# tag se puede mover a otro código. Al final de cada línea va su versión.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      # Ruff sale de requirements-dev.txt para usar la misma versión que en local
      - run: pip install -r requirements-dev.txt

      - run: ruff format --check .

      - run: ruff check .

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # La misma versión que la imagen y el .venv
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      # requirements-dev.txt no incluye al otro, así que se instalan los dos
      - run: pip install -r requirements.txt -r requirements-dev.txt

      # up --wait da error si un contenedor termina, aunque acabe bien. Por eso
      # flyway-test va aparte con run, que espera a que termine.
      - run: |
          docker compose -f docker-compose.test.yml up -d --wait db-test redis-test
          docker compose -f docker-compose.test.yml run --rm flyway-test

      - run: pytest -v

  chart-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # La misma versión de Helm que en local, para que el CI dé lo mismo
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.1

      - run: helm lint --strict charts/project0

  build:
    # Solo se construye si pasan el lint, los tests y el chart, porque estas
    # imágenes son las que se acabarán desplegando con él.
    needs: [lint, tests, chart-lint]
    # Una copia de este job por imagen. Todas llevan el SHA del mismo commit,
    # así que se despliegan juntas con el mismo tag.
    strategy:
      matrix:
        include:
          - name: api
            context: .
            image: project0
          - name: migrations
            context: migrations
            image: project0-migrations
          - name: frontend
            context: frontend
            image: project0-frontend
    name: build (${{ matrix.name }})
    runs-on: ubuntu-latest
    # El token que GitHub da al job necesita permiso para subir al registry
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # QEMU emula arm64 en el runner, que es amd64. Solo hace falta en main,
      # que es donde se construyen las dos arquitecturas.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: github.ref == 'refs/heads/main'

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Solo main sube la imagen, así que solo ahí hace falta iniciar sesión
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pone como tag de la imagen el SHA corto del commit, para saber qué código
      # lleva cada una
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: type=sha,prefix=

      # En main la sube a GHCR. En el resto de ramas solo comprueba que se
      # construye.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          push: ${{ github.ref == 'refs/heads/main' }}
          # En main, arm64 para los nodos de kind y amd64 para servidores. En
          # el resto de ramas basta amd64, que es nativa y no hay que emular.
          platforms: ${{ github.ref == 'refs/heads/main' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Guarda las capas en la caché de Actions, una por imagen para que
          # cada build no pise la caché de los otros
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
